  <text x="24" y="47" class="sub">同一个 query 位置，4 个 GQA 组各自独立选出 16 个块。横轴为块编号 0 - 63。</text>

  <text x="604" y="90" class="sub" fill="#999">块 40 - 63：位于 i 之后，因果不可见，分数置负无穷</text>

