  <text x="640" y="267" class="sub">三角标 = 4 个组都选中（共 6 块：sink + 最近 5 块）</text>

  <text x="66"    y="286" text-anchor="middle" class="tick">0</text>
  <text x="202"   y="286" text-anchor="middle" class="tick">10</text>
  <text x="338"   y="286" text-anchor="middle" class="tick">20</text>
  <text x="474"   y="286" text-anchor="middle" class="tick">30</text>
  <text x="596.4" y="286" text-anchor="middle" class="tick">39</text>
  <text x="922.8" y="286" text-anchor="middle" class="tick">63</text>

  <line x1="24" y1="300" x2="976" y2="300" stroke="#ddd"/>
  <g>
    <rect class="sink" x="26" y="310" width="12" height="12"/>
    <text x="44" y="321" class="note">块 0 · attention sink：4 组全选，但这是<tspan font-weight="600">自发涌现</tspan>的，最终配方并未强制（附录 C.2）</text>
    <rect class="loc" x="26" y="330" width="12" height="12"/>
    <text x="44" y="341" class="note">块 39 · local block：包含 i 自身，<tspan font-weight="600">唯一被硬编码强制选中</tspan>的块，占掉 16 个槽位中的 1 个</text>
    <rect class="sel" x="26" y="350" width="12" height="12"/>
    <text x="44" y="361" class="note">索引器自由选出的 15 个块：4 个组在中远距离上<tspan font-weight="600">明显选了不同的条纹</tspan>，40 个可见块里共命中 26 个</text>
  </g>

  <line x1="24" y1="374" x2="976" y2="374" stroke="#ddd"/>
  <text x="24" y="394" class="note"><tspan font-weight="600">实际读到多少 token？</tspan>  15 个完整块 x 128 = 1920，加上 local 块 39 中因果可见的 9 个 token（4992 - 5000），合计 <tspan font-weight="600" fill="#c0392b">1929</tspan> 个。</text>
  <text x="24" y="412" class="note">这就是论文写 "at most k*B_k" 而不是"等于"的原因：local 块几乎总是残缺的，块内仍要做因果 mask。</text>
</svg>
