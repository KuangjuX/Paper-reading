<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .title{font-size:16px;font-weight:600;}
    .ptitle{font-size:13px;font-weight:600;fill:#1f3d7a;}
    .sub{font-size:10.5px;fill:#666;}
    .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;}
    .box{stroke:#444;stroke-width:1.1;}
    .bb{fill:#dde7ff;}
    .ix{fill:#e7d8f0;}
    .ls{fill:#fdeceb;stroke:#e8b4b0;}
    .nn{fill:#f7f7f7;}
    .note{font-size:10.5px;fill:#555;}
    .cut{stroke:#c0392b;stroke-width:2.2;}
    .fw{stroke:#888;stroke-width:1.2;fill:none;}
    .glm{stroke:#1f6fb2;stroke-width:1.6;fill:none;}
    .gkl{stroke:#7b3fa0;stroke-width:1.6;fill:none;stroke-dasharray:5 3;}
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6fb2"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b3fa0"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="24" y="28" class="title">图 7 · MSA 一层的梯度流：三处切断把 KL 关进索引分支</text>
  <text x="24" y="48" class="sub">灰线 = 前向；蓝线 = LM 损失的梯度；紫虚线 = KL 损失的梯度；红叉 = 梯度被切断的位置</text>

  <rect class="box nn" x="440" y="70" width="200" height="34" rx="4"/>
  <text x="540" y="92" text-anchor="middle" class="mono">X  隐藏状态（残差流）</text>

  <line class="fw" x1="490" y1="104" x2="300" y2="150" marker-end="url(#a3)"/>
  <line class="fw" x1="590" y1="104" x2="780" y2="150" marker-end="url(#a3)"/>

  <g class="cut">
    <line x1="691" y1="115" x2="709" y2="133"/>
    <line x1="709" y1="115" x2="691" y2="133"/>
  </g>
  <text x="718" y="128" class="note" fill="#c0392b">stopgrad(X)　公式 (11)</text>

  <text x="150" y="146" class="ptitle">Main Branch</text>
  <rect class="box bb" x="140" y="156" width="280" height="34" rx="4"/>
  <text x="280" y="178" text-anchor="middle" class="mono">Q, K, V = X·W_q, X·W_k, X·W_v</text>
  <line class="fw" x1="280" y1="190" x2="280" y2="216" marker-end="url(#a3)"/>
  <rect class="box bb" x="140" y="222" width="280" height="34" rx="4"/>
  <text x="280" y="244" text-anchor="middle" class="mono">S = Q·Kᵀ/√d_h  →  softmax</text>
  <line class="fw" x1="280" y1="256" x2="280" y2="282" marker-end="url(#a3)"/>
  <rect class="box bb" x="140" y="288" width="280" height="34" rx="4"/>
  <text x="280" y="310" text-anchor="middle" class="mono">O·W_o  →  layer output</text>
  <line class="fw" x1="280" y1="322" x2="280" y2="352" marker-end="url(#a3)"/>
  <rect class="box ls" x="170" y="358" width="220" height="30" rx="4"/>
  <text x="280" y="378" text-anchor="middle" class="mono" font-weight="600">L_LM</text>

  <text x="786" y="146" class="ptitle">Index Branch</text>
  <rect class="box ix" x="660" y="156" width="300" height="34" rx="4"/>
  <text x="810" y="178" text-anchor="middle" class="mono">Q_idx, K_idx = X̄·W_idx_q, X̄·W_idx_k</text>
  <line class="fw" x1="810" y1="190" x2="810" y2="216" marker-end="url(#a3)"/>
  <rect class="box ix" x="660" y="222" width="300" height="34" rx="4"/>
  <text x="810" y="244" text-anchor="middle" class="mono">S_idx = Q_idx·K_idxᵀ/√d_idx</text>
  <line class="fw" x1="810" y1="256" x2="810" y2="282" marker-end="url(#a3)"/>
  <rect class="box nn" x="690" y="288" width="270" height="34" rx="4"/>
  <text x="825" y="310" text-anchor="middle" class="mono">BlockMaxPool → TopK → I</text>

  <rect class="box ls" x="690" y="358" width="270" height="30" rx="4"/>
  <text x="825" y="378" text-anchor="middle" class="mono" font-weight="600">L_KL = D_KL( sg(P) ‖ P_idx )</text>

  <path class="fw" d="M 690 305 L 530 305 L 530 239 L 424 239" marker-end="url(#a3)"/>
  <g class="cut">
    <line x1="521" y1="263" x2="539" y2="281"/>
    <line x1="539" y1="263" x2="521" y2="281"/>
  </g>
  <text x="440" y="302" class="note" fill="#c0392b">TopK 输出整数下标，不可微</text>

  <path class="fw" d="M 672 256 L 672 373 L 686 373" marker-end="url(#a3)"/>
  <text x="664" y="340" text-anchor="end" class="note">P_idx（学生）</text>

  <path class="fw" d="M 140 244 L 90 244 L 90 412 L 826 412 L 826 392" marker-end="url(#a3)"/>
  <g class="cut">
    <line x1="491" y1="403" x2="509" y2="421"/>
    <line x1="509" y1="403" x2="491" y2="421"/>
  </g>
  <text x="524" y="406" class="note" fill="#c0392b">stopgrad(P)　公式 (10)</text>
  <text x="112" y="432" class="note">P（老师）：不必另算，直接取用主分支前向已经算出的那份注意力权重</text>

  <path class="glm" d="M 170 373 L 126 373 L 126 174 L 136 174" marker-end="url(#a1)"/>
  <path class="glm" d="M 126 174 L 126 88 L 436 88" marker-end="url(#a1)"/>
  <text x="24" y="206" class="note" fill="#1f6fb2">LM 梯度</text>
  <text x="24" y="222" class="note" fill="#1f6fb2">更新四个主投影</text>
  <text x="152" y="82" class="note" fill="#1f6fb2">继续回传进主干与更早的层</text>

  <path class="gkl" d="M 960 373 L 976 373 L 976 174 L 964 174" marker-end="url(#a2)"/>
  <text x="990" y="250" class="note" fill="#7b3fa0">KL 梯度</text>
  <text x="990" y="266" class="note" fill="#7b3fa0">只更新</text>
  <text x="990" y="282" class="note" fill="#7b3fa0">W_idx_q</text>
  <text x="990" y="298" class="note" fill="#7b3fa0">W_idx_k</text>
  <text x="990" y="318" class="note" fill="#7b3fa0">到此为止</text>

  <line x1="24" y1="452" x2="1056" y2="452" stroke="#ddd"/>
  <text x="24" y="474" class="ptitle">三处切断各自堵住一条路</text>
  <g class="note">
    <text x="40" y="498"><tspan font-weight="600">① sg(X)，公式 (11)</tspan>　堵住 KL 梯度经索引投影渗回残差流，避免附录 B.3 的梯度尖峰与 LM 发散</text>
    <text x="40" y="518"><tspan font-weight="600">② sg(P)，公式 (10)</tspan>　堵住「把主分支注意力改简单以降低 KL」的自蒸馏捷径，避免附录 B.3 的短上下文缓慢退化</text>
    <text x="40" y="538"><tspan font-weight="600">③ TopK 不可微</tspan>　这一处不是人为切断，而是问题本身；正因为它存在，才必须引入 KL 这条旁路监督</text>
  </g>
  <line x1="24" y1="556" x2="1056" y2="556" stroke="#ddd"/>
  <text x="24" y="578" class="note"><tspan font-weight="600">净效果</tspan>　L_KL 的反向图是一棵只有两个叶子的小树：从 L_KL 出发，经 P_idx 到 S_idx，止于 W_idx_q 与 W_idx_k。</text>
  <text x="24" y="596" class="note">索引分支完全寄生在主干上而不反向影响它 —— 这正是 MSA-CPT 能把现成 GQA checkpoint 安全转成稀疏的前提。</text>
</svg>
