<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .title{font-size:16px;font-weight:600;}
    .ptitle{font-size:13px;font-weight:600;fill:#1f3d7a;}
    .sub{font-size:10.5px;fill:#666;}
    .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;}
    .box{stroke:#444;stroke-width:1.1;}
    .sel{fill:#cfe3ff;stroke:#5a8fd6;}
    .unsel{fill:#f0f0f0;stroke:#c8c8c8;}
    .part{fill:#cfe3ff;stroke:#5a8fd6;stroke-dasharray:3 2;}
    .tea{fill:#dde7ff;}
    .stu{fill:#e7d8f0;}
    .nn{fill:#f7f7f7;}
    .note{font-size:10.5px;fill:#555;}
    .hl{fill:#fdeceb;stroke:#e8b4b0;}
  </style>
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="24" y="28" class="title">图 8 · KL 损失的师生分布怎么构造（固定一个 query 位置 i 和一个 GQA 组 r）</text>

  <text x="24" y="58" class="ptitle">第一步 · 确定支撑集：只在「选中块 ∩ 因果可见」的 token 上比较</text>

  <text x="24" y="80" class="sub">候选块示意（N = 8192 时实际有 64 块，B_k = 128），query 位于块 39</text>
  <g>
    <rect class="box sel"   x="24"  y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="42"  y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="60"  y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="78"  y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="96"  y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="114" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="132" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="150" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="168" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="186" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="204" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="222" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="240" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="258" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="276" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="294" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="312" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="330" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="348" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="366" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="384" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="402" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="420" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="438" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="456" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="474" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="492" y="88" width="16" height="26" rx="2"/>
    <rect class="box sel"   x="510" y="88" width="16" height="26" rx="2"/>
    <rect class="box part"  x="528" y="88" width="16" height="26" rx="2"/>
    <rect class="box unsel" x="546" y="88" width="16" height="26" rx="2" fill="#e8e8e8"/>
    <rect class="box unsel" x="564" y="88" width="16" height="26" rx="2" fill="#e8e8e8"/>
    <rect class="box unsel" x="582" y="88" width="16" height="26" rx="2" fill="#e8e8e8"/>
    <rect class="box unsel" x="600" y="88" width="16" height="26" rx="2" fill="#e8e8e8"/>
  </g>
  <text x="32" y="130" class="sub">块 0</text>
  <text x="536" y="130" text-anchor="middle" class="sub">块 39</text>

  <text x="628" y="88" class="sub"><tspan fill="#2d5fa8" font-weight="600">■</tspan> 索引器选中的 15 个完整块</text>
  <text x="628" y="104" class="sub"><tspan fill="#2d5fa8" font-weight="600">▨</tspan> 强制包含的 local 块 39（只有 9 个 token 可见）</text>
  <text x="628" y="120" class="sub"><tspan fill="#999" font-weight="600">■</tspan> 未被选中的块</text>
  <text x="628" y="136" class="sub"><tspan fill="#999" font-weight="600">■</tspan> 块 40 及以后：整块在 i 之后，分数为 −∞</text>

  <rect class="box hl" x="24" y="140" width="580" height="26" rx="4"/>
  <text x="34" y="158" class="mono">支撑集 I_tok = 15 × 128 + 9 = 1929 个 token　（不是 2048，因为 local 块残缺）</text>

  <line x1="24" y1="182" x2="976" y2="182" stroke="#ddd"/>

  <text x="24" y="206" class="ptitle">第二步 · 老师与学生都在这 1929 个 token 上归一化</text>

  <rect class="box nn" x="24" y="220" width="450" height="222" rx="5"/>
  <text x="38" y="242" class="ptitle">老师 P：主分支，组内 16 个头</text>
  <text x="38" y="260" class="note">这些权重不用另算 —— 就是主分支前向已经算出的注意力权重</text>

  <g>
    <rect class="box tea" x="38" y="272" width="120" height="24" rx="3"/>
    <text x="98" y="288" text-anchor="middle" class="mono">head ℓ=0  softmax</text>
    <rect class="box tea" x="38" y="300" width="120" height="24" rx="3"/>
    <text x="98" y="316" text-anchor="middle" class="mono">head ℓ=1  softmax</text>
    <text x="98" y="338" text-anchor="middle" class="sub">⋮（共 G = 16 个头）</text>
    <rect class="box tea" x="38" y="346" width="120" height="24" rx="3"/>
    <text x="98" y="362" text-anchor="middle" class="mono">head ℓ=15 softmax</text>
  </g>

  <line x1="162" y1="320" x2="196" y2="320" stroke="#666" stroke-width="1.2" marker-end="url(#b1)"/>
  <rect class="box tea" x="200" y="292" width="120" height="56" rx="4"/>
  <text x="260" y="316" text-anchor="middle" class="mono">算术平均 1/G</text>
  <text x="260" y="334" text-anchor="middle" class="sub">先各自 softmax，再平均</text>

  <line x1="324" y1="320" x2="356" y2="320" stroke="#666" stroke-width="1.2" marker-end="url(#b1)"/>
  <rect class="box tea" x="360" y="300" width="100" height="40" rx="4"/>
  <text x="410" y="325" text-anchor="middle" class="mono" font-weight="600">P（老师）</text>

  <rect class="box hl" x="38" y="386" width="422" height="44" rx="4"/>
  <text x="48" y="404" class="note"><tspan font-weight="600">为什么是概率级平均而不是先平均 logits？</tspan></text>
  <text x="48" y="420" class="note">算术平均是混合分布：只要有一个头重视 token j，混合结果就保留它至少 1/G 的质量。</text>

  <rect class="box nn" x="494" y="220" width="482" height="222" rx="5"/>
  <text x="508" y="242" class="ptitle">学生 P_idx：索引分支，一个头</text>
  <text x="508" y="260" class="note">token 级索引分数 S_idx（不是块级 M_idx）在同一支撑集上做 softmax</text>

  <rect class="box stu" x="508" y="278" width="200" height="26" rx="3"/>
  <text x="608" y="296" text-anchor="middle" class="mono">S_idx = Q_idx·K_idxᵀ/√d_idx</text>
  <line x1="608" y1="306" x2="608" y2="326" stroke="#666" stroke-width="1.2" marker-end="url(#b1)"/>
  <rect class="box stu" x="508" y="330" width="200" height="26" rx="3"/>
  <text x="608" y="348" text-anchor="middle" class="mono">softmax over I_tok</text>
  <line x1="712" y1="343" x2="744" y2="343" stroke="#666" stroke-width="1.2" marker-end="url(#b1)"/>
  <rect class="box stu" x="748" y="323" width="110" height="40" rx="4"/>
  <text x="803" y="348" text-anchor="middle" class="mono" font-weight="600">P_idx（学生）</text>

  <rect class="box hl" x="508" y="386" width="452" height="44" rx="4"/>
  <text x="518" y="404" class="note"><tspan font-weight="600">为什么在 token 级而不是块级做 KL？</tspan></text>
  <text x="518" y="420" class="note">块级 KL 经 max-pool 只有每块 1 个 token 拿到梯度；token 级让 1929 个分数全部被校准。</text>

  <line x1="24" y1="458" x2="976" y2="458" stroke="#ddd"/>

  <text x="24" y="482" class="ptitle">第三步 · 前向 KL，老师在前</text>

  <rect class="box nn" x="24" y="494" width="952" height="106" rx="5"/>
  <text x="40" y="518" class="mono">L_KL = (1 / N·H_kv) · Σ_i Σ_r  D_KL( stopgrad(P) ‖ P_idx )　　　公式 (10)</text>
  <text x="40" y="542" class="note">老师被 detach ⇒ D_KL 中的 −Σ P log P 是常数 ⇒ 该项实际等价于一个以 P 为软标签的交叉熵。对 S_idx 求导后化简得到：</text>
  <rect class="box hl" x="40" y="552" width="300" height="30" rx="4"/>
  <text x="190" y="572" text-anchor="middle" class="mono" font-weight="600">∂L_KL / ∂S_idx[j] = P_idx[j] − P[j]</text>
  <text x="356" y="566" class="note">打分偏高就压低、偏低就抬高的纯校准信号，且逐项落在 [−1, 1] 内，天然有界。</text>
  <text x="356" y="582" class="note">前向 KL 是 mass-covering 的：老师重视而学生忽略会被重罚 —— 对检索器正是「宁可多选，不能漏选」。</text>
</svg>
