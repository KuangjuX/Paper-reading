<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .title{font-size:16px;font-weight:600;}
    .ptitle{font-size:13px;font-weight:600;fill:#1f3d7a;}
    .sub{font-size:10.5px;fill:#666;}
    .mono{font-family:Menlo,Consolas,monospace;font-size:11px;}
    .shape{font-family:Menlo,Consolas,monospace;font-size:11px;fill:#0b6b3a;font-weight:600;}
    .box{stroke:#444;stroke-width:1.1;}
    .idx{fill:#dde7ff;}
    .key{fill:#e7d8f0;}
    .gat{fill:#ffe2c8;}
    .mn{fill:#d9efd0;}
    .out{fill:#f2f2f2;}
    .note{font-size:10.5px;fill:#555;}
    .warn{font-size:10.5px;fill:#c0392b;}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="24" y="28" class="title">图 6  单个 query 位置的完整计算：i = 5000，组 r = 1（N = 8192）</text>
  <text x="24" y="47" class="sub">这一整套流程，对每个 (位置, 组) 组合各跑一次；图中所有形状都是该组合下的实际形状。</text>

  <text x="24" y="76" class="ptitle">A. 索引分支：算出该读哪 16 个块</text>
  <rect class="box idx" x="24" y="88" width="150" height="52" rx="4"/>
  <text x="99" y="107" text-anchor="middle" class="mono">Q_idx[5000, 组1]</text>
  <text x="99" y="126" text-anchor="middle" class="shape">(128,)</text>
  <text x="186" y="118" font-size="15" text-anchor="middle">x</text>
  <rect class="box key" x="200" y="88" width="150" height="52" rx="4"/>
  <text x="275" y="107" text-anchor="middle" class="mono">K_idx[0 : 5001]</text>
  <text x="275" y="126" text-anchor="middle" class="shape">(5001, 128)</text>
  <line x1="358" y1="114" x2="396" y2="114" stroke="#555" marker-end="url(#ar)"/>
  <rect class="box idx" x="404" y="88" width="140" height="52" rx="4"/>
  <text x="474" y="107" text-anchor="middle" class="mono">token 级分数 s</text>
  <text x="474" y="126" text-anchor="middle" class="shape">(5001,)</text>
  <line x1="552" y1="114" x2="590" y2="114" stroke="#555" marker-end="url(#ar)"/>
  <text x="571" y="106" text-anchor="middle" class="sub">块内 max</text>
  <rect class="box idx" x="598" y="88" width="140" height="52" rx="4"/>
  <text x="668" y="107" text-anchor="middle" class="mono">块级分数 m</text>
  <text x="668" y="126" text-anchor="middle" class="shape">(64,)</text>
  <line x1="746" y1="114" x2="784" y2="114" stroke="#555" marker-end="url(#ar)"/>
  <text x="765" y="106" text-anchor="middle" class="sub">TopK</text>
  <rect class="box gat" x="792" y="88" width="184" height="52" rx="4"/>
  <text x="884" y="107" text-anchor="middle" class="mono">I（16 个块下标）</text>
  <text x="884" y="126" text-anchor="middle" class="shape">(16,)</text>
  <text x="598" y="158" class="sub">40 个有效值 + 24 个负无穷（块 40-63 在 i 之后）</text>

  <line x1="24" y1="176" x2="976" y2="176" stroke="#eee"/>
  <text x="24" y="200" class="ptitle">B. Gather：把 16 个"块编号"翻译成真实的 token 行，并拷成连续缓冲</text>

  <rect class="box gat" x="24" y="212" width="240" height="120" rx="4"/>
  <text x="144" y="232" text-anchor="middle" class="mono" font-weight="600">I = [0, 4, 7, 9, 15, 17, 20, 26,</text>
  <text x="144" y="249" text-anchor="middle" class="mono" font-weight="600">28, 31, 33, 35, 36, 37, 38, 39]</text>
  <text x="144" y="272" text-anchor="middle" class="sub">仅仅是 16 个整数</text>
  <text x="144" y="296" text-anchor="middle" class="sub">块 b 覆盖 token</text>
  <text x="144" y="313" text-anchor="middle" class="mono">[128b, 128b+127]</text>

  <line x1="272" y1="270" x2="310" y2="270" stroke="#555" marker-end="url(#ar)"/>
  <text x="291" y="262" text-anchor="middle" class="sub">展开</text>

  <rect class="box gat" x="318" y="212" width="270" height="120" rx="4"/>
  <g class="mono" font-size="10.5">
    <text x="332" y="232">块 0  -&gt; token    0 -  127  （128 行）</text>
    <text x="332" y="250">块 4  -&gt; token  512 -  639  （128 行）</text>
    <text x="332" y="268">块 7  -&gt; token  896 - 1023  （128 行）</text>
    <text x="332" y="286">......</text>
    <text x="332" y="304">块 38 -&gt; token 4864 - 4991  （128 行）</text>
    <text x="332" y="322" fill="#c0392b">块 39 -&gt; token 4992 - <tspan font-weight="700">5000</tspan>  （仅 9 行）</text>
  </g>

  <line x1="596" y1="270" x2="634" y2="270" stroke="#555" marker-end="url(#ar)"/>
  <text x="615" y="262" text-anchor="middle" class="sub">拷贝</text>

  <rect class="box mn" x="642" y="212" width="180" height="120" rx="4"/>
  <text x="732" y="238" text-anchor="middle" class="mono" font-weight="600">K_sel  V_sel</text>
  <text x="732" y="262" text-anchor="middle" class="shape">(1929, 128)</text>
  <text x="732" y="288" text-anchor="middle" class="sub">15x128 + 9 = 1929</text>
  <text x="732" y="308" text-anchor="middle" class="sub">连续、稠密、可直接喂 MMA</text>

  <rect x="836" y="212" width="140" height="120" rx="4" fill="#fdeceb" stroke="#e8b4b0"/>
  <text x="848" y="234" class="warn" font-weight="600">Gather 不是数学运算</text>
  <text x="848" y="252" class="note">它是纯粹的<tspan font-weight="600">搬数据</tspan>：</text>
  <text x="848" y="269" class="note">GPU 的矩阵乘法只认</text>
  <text x="848" y="286" class="note">连续内存，不认"下标</text>
  <text x="848" y="303" class="note">列表"，所以必须先把</text>
  <text x="848" y="320" class="note">散落的行收拢到一起。</text>

  <line x1="24" y1="350" x2="976" y2="350" stroke="#eee"/>
  <text x="24" y="374" class="ptitle">C. 主分支：组内 16 个 query 头，在这 1929 个 token 上做标准 attention</text>

  <rect class="box mn" x="24" y="386" width="164" height="52" rx="4"/>
  <text x="106" y="405" text-anchor="middle" class="mono">Q[5000, 头 16-31]</text>
  <text x="106" y="424" text-anchor="middle" class="shape">(16, 128)</text>
  <text x="200" y="416" font-size="15" text-anchor="middle">x</text>
  <rect class="box mn" x="214" y="386" width="140" height="52" rx="4"/>
  <text x="284" y="405" text-anchor="middle" class="mono">K_sel 转置</text>
  <text x="284" y="424" text-anchor="middle" class="shape">(128, 1929)</text>
  <line x1="362" y1="412" x2="400" y2="412" stroke="#555" marker-end="url(#ar)"/>
  <rect class="box mn" x="408" y="386" width="150" height="52" rx="4"/>
  <text x="483" y="405" text-anchor="middle" class="mono">scores / sqrt(128)</text>
  <text x="483" y="424" text-anchor="middle" class="shape">(16, 1929)</text>
  <line x1="566" y1="412" x2="604" y2="412" stroke="#555" marker-end="url(#ar)"/>
  <text x="585" y="404" text-anchor="middle" class="sub">softmax</text>
  <rect class="box mn" x="612" y="386" width="150" height="52" rx="4"/>
  <text x="687" y="405" text-anchor="middle" class="mono">概率 P</text>
  <text x="687" y="424" text-anchor="middle" class="shape">(16, 1929)</text>
  <line x1="770" y1="412" x2="808" y2="412" stroke="#555" marker-end="url(#ar)"/>
  <text x="789" y="404" text-anchor="middle" class="sub">x V_sel</text>
  <rect class="box mn" x="816" y="386" width="160" height="52" rx="4"/>
  <text x="896" y="405" text-anchor="middle" class="mono">该组输出</text>
  <text x="896" y="424" text-anchor="middle" class="shape">(16, 128)</text>

  <rect x="24" y="450" width="952" height="34" rx="4" fill="#fff8e6" stroke="#e0c98a"/>
  <text x="38" y="471" class="note"><tspan font-weight="600" fill="#8a6d1f">关键语义</tspan>：softmax 的分母只累加这 1929 个 token，<tspan font-weight="600">不是全部 5001 个</tspan>。没被选中的 token 等价于被赋予概率 0，概率质量在选中子集上<tspan font-weight="600">重新归一化</tspan>。</text>

  <line x1="24" y1="500" x2="976" y2="500" stroke="#eee"/>
  <text x="24" y="524" class="ptitle">D. 汇总：4 个组拼起来，再过输出投影</text>

  <rect class="box out" x="24" y="536" width="196" height="48" rx="4"/>
  <text x="122" y="555" text-anchor="middle" class="mono">4 组各 (16,128) 拼接</text>
  <text x="122" y="574" text-anchor="middle" class="shape">(64, 128)</text>
  <line x1="228" y1="560" x2="266" y2="560" stroke="#555" marker-end="url(#ar)"/>
  <text x="247" y="552" text-anchor="middle" class="sub">展平</text>
  <rect class="box out" x="274" y="536" width="150" height="48" rx="4"/>
  <text x="349" y="555" text-anchor="middle" class="mono">位置 5000 的向量</text>
  <text x="349" y="574" text-anchor="middle" class="shape">(8192,)</text>
  <line x1="432" y1="560" x2="470" y2="560" stroke="#555" marker-end="url(#ar)"/>
  <text x="451" y="552" text-anchor="middle" class="sub">x W_o</text>
  <rect class="box out" x="478" y="536" width="150" height="48" rx="4"/>
  <text x="553" y="555" text-anchor="middle" class="mono">层输出</text>
  <text x="553" y="574" text-anchor="middle" class="shape">(3072,)</text>
  <text x="648" y="556" class="note">和输入 X[5000] 形状一致，可以进残差流。</text>
  <text x="648" y="574" class="note">对全部 8192 个位置重复，得到 O = (8192, 3072)。</text>

  <text x="24" y="612" class="note"><tspan font-weight="600">注意</tspan>：图中把 K_sel 画成独立缓冲只是为了讲清逻辑。真要为每个 (位置, 组) 都物化一份，显存需要约 17 GB —— 实际内核里 gather 是<tspan font-weight="600">融合进 attention、逐 tile 完成</tspan>的。</text>
</svg>
